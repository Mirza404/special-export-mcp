name: Install deps
description: Set up Python and install the package with its mcp and dev extras

inputs:
  python-version:
    description: Python version to set up
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - shell: bash
      run: pip install -e ".[mcp,dev]"
